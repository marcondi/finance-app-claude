<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="App de Finanças Pessoais com Google Calendar integrado" />
    <meta property="og:title" content="FinanceApp" />
    <meta property="og:description" content="App de Finanças Pessoais com Google Calendar integrado" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FinanceApp" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <title>FinanceApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var isDev = window.location.hostname.includes('run.app') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          } else {
            navigator.serviceWorker.register('/service-worker.js')
              .catch(function() {});
          }
        });
      }
    </script>
  </head>
  <body>
    <noscript>Você precisa habilitar JavaScript para rodar este app.</noscript>
    <div id="root"></div>
  </body>
</html>
